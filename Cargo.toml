[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

authors = ["gamengine contributors"]

[workspace.dependencies]
# internal crates
gm-core = { path = "crates/gm-core" }
gm-bsp = { path = "crates/gm-bsp" }
gm-net = { path = "crates/gm-net" }
gm-ai = { path = "crates/gm-ai" }
gm-content = { path = "crates/gm-content" }

# math / data
glam = "0.33.11"
bytemuck = { version = "1.25.2", features = ["derive"] }
hecs = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
bitcode = "0.6.9"
sha2 = "0.11.0"
lru = "0.18.5"

# rendering / windowing
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
pollster = "1.0.1"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
kira = "0.12.5"

# server / net
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "signal", "macros", "sync"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
bytes = "1.12.1"
wtransport = "0.7.2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
argon2 = "0.6.0"
ed25519-dalek = "3.0.0"

# diagnostics
log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
anyhow = "1.0.104"
thiserror = "2.0.21"

# tools
clap = { version = "4.6.7", features = ["derive"] }
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils"] }
ktx2 = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
walkdir = "2.5.0"

# testing
criterion = "0.8.2"
proptest = "1.11.0"
turmoil = "0.7.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 2

# Every number CI enforces. Read by gm-tools (budget check) and scripts/*.sh.
# Sources: PLAN.md 2.6 (assets), 11.8 (phase gates).

[character]
max_triangles = 3500        # PLAN 2.6: 2,500-3,500 tris. The floor is an art guideline, not a gate.
max_bones = 32
max_texture_size = 1024     # per axis
max_textures = 1            # one atlas, one draw call
max_payload_bytes = 1572864 # 1.5 MiB ceiling for the whole .glb

[map]
max_bsp_bytes = 33554432    # 32 MiB per zone map (generous; tighten when real maps exist)
max_lightmap_bytes = 16777216

[client]
max_binary_bytes = 10485760     # 10 MiB absolute (Phase 1 acceptance)
max_regression_bytes = 1048576  # 1 MiB over ci/baselines/gm-client-size fails
max_rss_bytes = 209715200       # 200 MiB (Phase 1 acceptance); product ceiling is 500 MiB
min_fps = 60                    # on the reference iGPU; only checked on a self-hosted runner

[net]
# PROTOCOL.md 9: UDP bytes per player per second in each direction, 16 players, 64 Hz.
max_bytes_per_player_s = 30720
# Acceptance test network: round trip and independent datagram loss per direction.
test_rtt_ms = 150
test_loss = 0.03

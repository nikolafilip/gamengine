[package]
name = "gm-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"
description = "gamengine client: wgpu forward renderer, Quake movement, fixed-step loop."

[features]
default = []
# The browser build for browsers without WebGPU (WEB.md 3.2): wgpu's GLES backend on WebGL2.
webgl = ["wgpu/webgl"]

[dependencies]
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
bitcode = { workspace = true }
log = { workspace = true }
gm-core = { workspace = true }
gm-bsp = { workspace = true }
gm-net = { workspace = true }
gm-hub-proto = { workspace = true }
gm-model = { workspace = true }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
gm-replay = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
bytes = { workspace = true }
# Paste into a field (CLIENT.md 3): a password manager's password is not typed by hand.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# The sound device (SOUND.md 4): the one crate sound needs; the mixer is our own.
cpal = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The mixer's promise that its renderer allocates nothing is asserted, not hoped (SOUND.md 4);
# in release tests too (its default feature would switch the assertion off there).
assert_no_alloc = { version = "1.1", default-features = false }

# The browser client (WEB.md 3): the browser is the transport, the timer and the file system.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Location",
    "UrlSearchParams", "Performance", "console",
    "Request", "RequestInit", "RequestCache", "Response", "ResponseInit", "Headers",
    "Cache", "CacheStorage", "Storage",
    # Sound (SOUND.md 5): the browser's own mixer.
    "AudioContext", "BaseAudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode",
    "AudioScheduledSourceNode", "AudioNode", "AudioParam", "AudioDestinationNode", "GainNode",
    "StereoPannerNode", "AnalyserNode", "EventTarget",
] }

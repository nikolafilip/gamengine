# Preset builds (MATRIX.md 9, 11, 15 and 17: seven, one frame-and-element face each). `mode` is the game the archetype plays (MODES.md 2:
# gun, action, rpg); a gun build's primary is a firearm and it has no guard. Attributes are the character's own thirty points
# (each point above 5; a preset spends all thirty). The kit costs at most 40: armour
# (cloth 0 / leather 4 / mail 8 / plate 12), a second aspect (10) and the slotted abilities.
# The range is the weapon's (2026-10-06): a melee primary has no bolt, a ranged primary is
# the whole of its damage at range. `blurb` is what the archetype is, in a line or two of
# plain words (CLIENT.md 4.3): at most 160 characters of ASCII.

[[build]]
name = "ironclad"
mode = "action"
blurb = "A wall of plate behind a shield, with a sword too big for anyone else. Bellows, and every enemy in earshot turns to it."
frame = "colossus"
attributes = { str = 15, agi = 5, con = 20, int = 5, spr = 10 }    # 30
armour = "plate"                                                     # 12
aspects = ["ground"]
primary = "greatsword"                                               # 2  (MATRIX.md 16; the hammer until 2026-10-09)
secondary = "shield_bash"                                            # 2
guard = "shield_wall"                                                # 6  (the shield in the off hand)
actives = ["stomp", "bellow"]                                        # 10 + 8  = 40

[[build]]
name = "blade"
mode = "action"
blurb = "A sword and a parry. Charges in and is strong in a duel, but has to get close and stay close."
frame = "striker"
attributes = { str = 17, agi = 13, con = 15, int = 5, spr = 5 }    # 30
armour = "mail"                                                      # 8
aspects = ["water"]                                                  # a defence: halves the frostweaver
primary = "sword"                                                    # 2
secondary = "kick"                                                   # 2
guard = "parry"                                                      # 4
actives = ["charge", "overhead"]                                     # 6 + 8  = 30

[[build]]
name = "frostweaver"
mode = "rpg"
blurb = "Ice from a distance. Slows and freezes what comes near, then walks away from it. Wears cloth: one clean hit hurts."
frame = "caster"
attributes = { str = 5, agi = 10, con = 5, int = 20, spr = 15 }    # 30
armour = "cloth"                                                     # 0
aspects = ["water", "air"]                                           # 10: Ground is 0.5x in
primary = "ice_shard"                                                # 2
secondary = "kick"                                                   # 2
guard = "brace"                                                      # 2
actives = ["frost_nova"]                                             # 10  = 26

[[build]]
name = "shade"
mode = "action"
blurb = "Unseen until it strikes. A dagger, a knife, poison and a way out. Dies quickly when caught in the open."
frame = "infiltrator"
attributes = { str = 15, agi = 20, con = 10, int = 5, spr = 5 }    # 30
armour = "leather"                                                   # 4
aspects = ["air"]
primary = "dagger"                                                   # 0
secondary = "throwing_knife"                                         # 3
guard = "parry"                                                      # 4
actives = ["blink", "vanish", "poison_cloud"]                        # 10 + 8 + 8  = 37

# Phase 7 (COMPANIONS.md 12): the healer the tutorial needs.

[[build]]
name = "mender"
mode = "rpg"
blurb = "Keeps the others standing: mends wounds, hallows ground, hurries allies. The one a party cannot do without."
frame = "caster"
attributes = { str = 5, agi = 5, con = 10, int = 15, spr = 20 }    # 30
armour = "cloth"                                                     # 0
aspects = ["electric"]
primary = "staff"                                                    # 0
secondary = "mend"                                                   # 4
guard = "brace"                                                      # 2
actives = ["sanctuary", "haste", "thunderclap"]                      # 10 + 8 + 10  = 34



# The gun (MODES.md 3): first person, a musket and a pistol, the knife that every gun
# build has, the legs for the way out. No element: the gun is the neutral build.

[[build]]
name = "musketeer"
mode = "gun"
blurb = "A musket, a pistol and a knife. One shot that has to land, then the reload; lethal from a window, lost in a doorway."
frame = "striker"
attributes = { str = 10, agi = 17, con = 13, int = 5, spr = 10 }   # 30
armour = "leather"                                                   # 4
aspects = []                                                         # neutral (MATRIX.md 15)
primary = "musket"                                                   # 2
secondary = "pistol"                                                 # 3
actives = ["dash", "leap"]                                           # 6 + 6  = 21

# The shaman (MATRIX.md 17): the hammer's build, Grass, half a healer. Walls every caster in
# the roster (Water, Ground and Electric are 0.5x into Grass) and is cut down by steel
# (leather: slash 1.0 in).

[[build]]
name = "shaman"
mode = "rpg"
blurb = "A hammer, thorns and vines. Shrugs off ice and stone, grows briars that feed its own side and tear at the rest. Steel cuts it."
frame = "caster"
attributes = { str = 13, agi = 8, con = 14, int = 15, spr = 5 }    # 30
armour = "leather"                                                   # 4
aspects = ["grass"]
primary = "hammer"                                                   # 2
secondary = "slam"                                                   # 4
guard = "brace"                                                      # 2
actives = ["briar", "entangle"]                                      # 10 + 10  = 32

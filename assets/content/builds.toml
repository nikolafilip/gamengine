# Preset builds (MATRIX.md 9 and 11). Attributes are the character's own thirty points
# (each point above 5; a preset spends all thirty). The kit costs at most 40: armour
# (cloth 0 / leather 4 / mail 8 / plate 12), a second aspect (10) and the slotted abilities.
# The range is the weapon's (2026-10-06): a melee primary has no bolt, a ranged primary is
# the whole of its damage at range. `blurb` is what the archetype is, in a line or two of
# plain words (CLIENT.md 4.3): at most 160 characters of ASCII.

[[build]]
name = "ironclad"
blurb = "A wall of plate with a hammer. Slow and hard to move: holds a doorway and takes the blows meant for others."
frame = "colossus"
attributes = { str = 15, agi = 5, con = 20, int = 5, spr = 10 }    # 30
armour = "plate"                                                     # 12
aspects = ["stone"]
primary = "hammer"                                                   # 2
secondary = "shield_bash"                                            # 2
guard = "shield_wall"                                                # 6
actives = ["stomp", "fortify"]                                       # 10 + 8  = 40

[[build]]
name = "blade"
blurb = "A sword and a parry. Fast on the feet and strong in a duel, but has to get close and stay close."
frame = "striker"
attributes = { str = 17, agi = 13, con = 15, int = 5, spr = 5 }    # 30
armour = "mail"                                                      # 8
aspects = ["flame"]
primary = "sword"                                                    # 2
secondary = "kick"                                                   # 2
guard = "parry"                                                      # 4
actives = ["dash", "overhead"]                                       # 6 + 8  = 30

[[build]]
name = "frostweaver"
blurb = "Ice from a distance. Slows and freezes what comes near, then steps away. Wears cloth: one clean hit hurts."
frame = "caster"
attributes = { str = 5, agi = 10, con = 5, int = 20, spr = 15 }    # 30
armour = "cloth"                                                     # 0
aspects = ["frost", "shadow"]                                        # 10
primary = "ice_shard"                                                # 2
secondary = "kick"                                                   # 2
guard = "brace"                                                      # 2
actives = ["frost_nova", "blink"]                                    # 10 + 10  = 36

[[build]]
name = "shade"
blurb = "Unseen until it strikes. A dagger, a knife, poison and a way out. Dies quickly when caught in the open."
frame = "infiltrator"
attributes = { str = 15, agi = 20, con = 10, int = 5, spr = 5 }    # 30
armour = "leather"                                                   # 4
aspects = ["shadow"]
primary = "dagger"                                                   # 0
secondary = "throwing_knife"                                         # 3
guard = "parry"                                                      # 4
actives = ["blink", "vanish", "poison_cloud"]                        # 10 + 8 + 8  = 37

# Phase 7 (COMPANIONS.md 12): the healer the tutorial needs and a leadership build.

[[build]]
name = "mender"
blurb = "Keeps the others standing: mends wounds, hallows ground, hurries allies. The one a party cannot do without."
frame = "caster"
attributes = { str = 5, agi = 5, con = 10, int = 15, spr = 20 }    # 30
armour = "cloth"                                                     # 0
aspects = ["storm"]
primary = "staff"                                                    # 0
secondary = "mend"                                                   # 4
guard = "brace"                                                      # 2
actives = ["sanctuary", "haste", "thunderclap"]                      # 10 + 8 + 10  = 34

[[build]]
name = "captain"
blurb = "Leads from the front: a sword, a kick and a standard that lets five companions follow instead of three."
frame = "striker"
attributes = { str = 15, agi = 10, con = 15, int = 5, spr = 10 }   # 30
armour = "mail"                                                      # 8
aspects = ["flame"]
primary = "sword"                                                    # 2
secondary = "kick"                                                   # 2
guard = "parry"                                                      # 4
actives = ["war_standard", "dash"]                                   # 10 (five companions) + 6  = 32

# 2026-10-06: the ranged fighter without an element, now that the crossbow is a primary.

[[build]]
name = "marksman"
blurb = "A crossbow and the legs to keep the distance. One heavy bolt at a time; helpless with a sword at the throat."
frame = "striker"
attributes = { str = 10, agi = 20, con = 10, int = 5, spr = 10 }   # 30
armour = "leather"                                                   # 4
aspects = ["storm"]
primary = "crossbow"                                                 # 2
secondary = "throwing_knife"                                         # 3
guard = "brace"                                                      # 2
actives = ["dash", "leap", "haste"]                                  # 6 + 6 + 8  = 31

# Preset builds (MATRIX.md 9 and 11). Every build spends exactly 100 points:
# attributes (each point above 5), armour (cloth 0 / leather 4 / mail 8 / plate 12),
# a second aspect (10) and the slotted abilities.

[[build]]
name = "ironclad"
frame = "colossus"
attributes = { str = 20, agi = 5, con = 20, int = 18, spr = 20 }   # 58
armour = "plate"                                                     # 12
aspects = ["stone"]
primary = "hammer"                                                   # 2
secondary = "stone_throw"                                            # 4
guard = "shield_wall"                                                # 6
actives = ["stomp", "fortify"]                                       # 10 + 8

[[build]]
name = "blade"
frame = "striker"
attributes = { str = 20, agi = 20, con = 20, int = 15, spr = 18 }  # 68
armour = "mail"                                                      # 8
aspects = ["flame"]
primary = "sword"                                                    # 2
secondary = "firebolt"                                               # 4
guard = "parry"                                                      # 4
actives = ["dash", "overhead"]                                       # 6 + 8

[[build]]
name = "frostweaver"
frame = "caster"
attributes = { str = 5, agi = 20, con = 16, int = 20, spr = 20 }   # 56
armour = "cloth"                                                     # 0
aspects = ["frost", "shadow"]                                        # 10
primary = "staff"                                                    # 0
secondary = "ice_shard"                                              # 4
guard = "brace"                                                      # 2
actives = ["frost_nova", "haste", "blink"]                           # 10 + 8 + 10

[[build]]
name = "shade"
frame = "infiltrator"
attributes = { str = 15, agi = 20, con = 15, int = 18, spr = 20 }  # 63
armour = "leather"                                                   # 4
aspects = ["shadow"]
primary = "dagger"                                                   # 0
secondary = "shadow_dart"                                            # 3
guard = "parry"                                                      # 4
actives = ["blink", "vanish", "poison_cloud"]                        # 10 + 8 + 8

